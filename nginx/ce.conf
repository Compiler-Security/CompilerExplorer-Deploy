# =============================================================================
# CompilerExplorer 的外部 nginx 参考配置
#   丢进你们现有 nginx 的 conf.d/ 即可（conf.d/*.conf 在 http{} 上下文内被 include，
#   所以下面的 map / limit_req_zone / server 都能放）。
#   后端是 CE 容器发布到宿主机回环的 127.0.0.1:10240。
#
# 按你们要求：不加认证、不做 TLS（纯内网 HTTP），仅做安全加固
# （安全响应头 / 限流 / 限制请求体 / 隐藏后端）。
# 若之后要 HTTPS：在 server 块加 ssl_certificate 等即可，其余不变。
# =============================================================================

# WebSocket 升级头映射（CE 有实时特性/execqueue，需要 WebSocket）。
map $http_upgrade $ce_connection_upgrade {
    default upgrade;
    ''      close;
}

# 限流区（按客户端 IP）。
limit_req_zone $binary_remote_addr zone=ce_per_ip:10m rate=30r/s;

server {
    listen 80;
    server_name ce.internal.example.com;   # TODO: 改成你们的内网域名或 _

    # ---- 安全：限制请求体（与 CE maxUploadSize 对齐）----
    client_max_body_size 16m;

    # ---- 安全响应头 ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # CSP 按 CE 前端需要放行内联脚本/样式（其构建产物含内联 runtime）。
    # 若安全扫描要求更严可改 nonce 方案（需配合 CE 模板），先以可用为准。
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    location / {
        limit_req zone=ce_per_ip burst=60 nodelay;

        proxy_pass http://127.0.0.1:10240;
        proxy_http_version 1.1;

        # WebSocket 支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ce_connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;           # 覆盖长编译
        proxy_send_timeout 300s;
    }
}
