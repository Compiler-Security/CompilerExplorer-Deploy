name: ce-vm

# =============================================================================
# 外层（跑在共享宿主机上）：只在 Docker 里起一个 QEMU/KVM VM，CE 直接跑在 VM 内
# （node + systemd + nsjail，无内层 docker）。
#   共享宿主机的唯一改动 = 这个容器 + /dev/kvm；cgroup/AppArmor/userns 一律不动。
#
#   用法:
#     cp .env.example .env        # 填 CE_COMPILERS_ROOT（+ 可选 CE_REF / CE_VM_SSH_PUBKEY）
#     docker compose -f docker-compose.vm.yml build qemu
#     docker compose -f docker-compose.vm.yml up -d
#   外部 nginx 反代到 127.0.0.1:10240（见 nginx/ce.conf）。
#
#   链路:
#     CE  : 外部 nginx -> 宿主 127.0.0.1:10240 -> qemu ->(hostfwd)-> VM:10240
#     SSH : 宿主 127.0.0.1:2222 ->(hostfwd)-> VM:22  （用于工具链更新后重启 CE 清缓存）
# =============================================================================

services:
  qemu:
    build: ./vm
    image: ssct/ce-qemu:local
    container_name: ce-vm
    restart: unless-stopped

    # 唯一需要的硬件访问：KVM。user-mode 网络（slirp）不需要 NET_ADMIN。
    devices:
      - /dev/kvm:/dev/kvm

    environment:
      VM_CPUS: "${VM_CPUS:-8}"
      VM_MEM_MB: "${VM_MEM_MB:-8192}"
      VM_DISK_SIZE: "${VM_DISK_SIZE:-40G}"
      CE_REF: "${CE_REF:-gh-18904}"          # CE 版本；改了会触发 VM 重新装配
      NODE_VERSION: "${NODE_VERSION:-}"       # 空则取 nodejs 最新 v22
      FWD_PORT: "10240"
      SSH_FWD_PORT: "2222"
      COMPILERS_SRC: /share/compilers
      REPO_SRC: /share/repo
      SSH_PUBKEY_FILE: /share/sshpub/ce_vm_key.pub

    volumes:
      - vm-disk:/vm/disk                                   # VM 磁盘持久化（含缓存的云镜像底包）
      - "${CE_COMPILERS_ROOT:?请在 .env 设置 CE_COMPILERS_ROOT}:/share/compilers:ro"  # 工具链 -> 9p 进 VM
      - ./:/share/repo:ro                                  # 本仓库 -> 9p 进 VM
      # 可选：把一个宿主 SSH 公钥挂进来，用于进 VM 管理 CE（重启清缓存）。
      # 在 .env 设 CE_VM_SSH_PUBKEY 指向宿主上的 .pub 文件。
      - "${CE_VM_SSH_PUBKEY:-/dev/null}:/share/sshpub/ce_vm_key.pub:ro"

    ports:
      # 对外仍只绑回环，由外部 nginx 反代。
      - "127.0.0.1:10240:10240"
      # SSH 进 VM（管理 CE），也只绑回环。
      - "127.0.0.1:2222:2222"

volumes:
  vm-disk:
