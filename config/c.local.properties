# C：x86_64 原生与 riscv64 交叉工具链；路径均走稳定的 *-latest 相对软链。

compilers=&clang:&clangriscv:&gcc:&gccriscv
defaultCompiler=cclanglatest
supportsExecute=false

# Clang x86_64
group.clang.compilers=cclanglatest
group.clang.groupName=Clang x86-64
group.clang.baseName=x86-64 clang
group.clang.isSemVer=true
group.clang.compilerType=clang
group.clang.intelAsm=-mllvm --x86-asm-syntax=intel
group.clang.demangler=/opt/compiler-explorer/clang-latest/bin/llvm-cxxfilt
group.clang.options=--gcc-toolchain=/opt/compiler-explorer/gcc-latest

compiler.cclanglatest.exe=/opt/compiler-explorer/clang-latest/bin/clang
compiler.cclanglatest.name=x86-64 clang C (latest)
compiler.cclanglatest.semver=latest

# Clang riscv64（复用同一 clang）
group.clangriscv.compilers=cclangriscv
group.clangriscv.groupName=Clang riscv64
group.clangriscv.baseName=riscv64 clang
group.clangriscv.isSemVer=true
group.clangriscv.compilerType=clang
group.clangriscv.options=--target=riscv64-linux-gnu --gcc-toolchain=/opt/compiler-explorer/gcc-riscv-latest

compiler.cclangriscv.exe=/opt/compiler-explorer/clang-latest/bin/clang
compiler.cclangriscv.name=riscv64 clang C (latest, cross)
compiler.cclangriscv.semver=latest

# GCC x86_64
group.gcc.compilers=cgcclatest
group.gcc.groupName=GCC x86-64
group.gcc.baseName=x86-64 gcc
group.gcc.isSemVer=true
group.gcc.compilerType=gcc

compiler.cgcclatest.exe=/opt/compiler-explorer/gcc-latest/bin/x86_64-linux-gnu-gcc
compiler.cgcclatest.name=x86-64 gcc C (latest)
compiler.cgcclatest.semver=latest

# GCC riscv64
group.gccriscv.compilers=cgccriscv
group.gccriscv.groupName=GCC riscv64
group.gccriscv.baseName=riscv64 gcc
group.gccriscv.isSemVer=true
group.gccriscv.compilerType=gcc

compiler.cgccriscv.exe=/opt/compiler-explorer/gcc-riscv-latest/bin/riscv64-linux-gnu-gcc
compiler.cgccriscv.name=riscv64 gcc C (latest, cross)
compiler.cgccriscv.semver=latest
