# 自研 mlir-opt / mlir-translate，路径走稳定软链 mlir-custom。

compilers=&mliropt:&mlirtranslate
defaultCompiler=myopt
compilerType=mlir
supportsBinary=false
supportsExecute=false
supportsAsmDocs=false

group.mliropt.compilers=myopt
group.mliropt.baseName=MLIR opt (our fork)
group.mliropt.isSemVer=false
group.mlirtranslate.compilers=mytranslate
group.mlirtranslate.baseName=MLIR translate (our fork)
group.mlirtranslate.isSemVer=false

compiler.myopt.exe=/opt/compiler-explorer/mlir-custom/bin/mlir-opt
compiler.myopt.name=mlir-opt (our fork)
compiler.myopt.semver=(fork)
# 可选默认 pass：
# compiler.myopt.options=--mlir-print-ir-after-all

compiler.mytranslate.exe=/opt/compiler-explorer/mlir-custom/bin/mlir-translate
compiler.mytranslate.name=mlir-translate (our fork)
compiler.mytranslate.semver=(fork)

# 运行库不在系统路径时二选一：
# compiler.myopt.ldPath=/opt/compiler-explorer/mlir-custom/lib
# compiler.myopt.envVars=LD_LIBRARY_PATH=/opt/compiler-explorer/mlir-custom/lib
