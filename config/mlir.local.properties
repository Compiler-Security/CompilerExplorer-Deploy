# 自研 mlir-opt / mlir-translate，路径走稳定软链 mlir-custom。

compilers=&mliropt:&mlirtranslate
defaultCompiler=mlir-opt
compilerType=mlir
supportsBinary=false
supportsExecute=false
supportsAsmDocs=false

group.mliropt.compilers=mlir-opt
group.mliropt.baseName=MLIR opt (our fork)
group.mliropt.isSemVer=false
group.mlirtranslate.compilers=mlir-translate
group.mlirtranslate.baseName=MLIR translate (our fork)
group.mlirtranslate.isSemVer=false

compiler.mlir-opt.exe=/opt/compiler-explorer/mlir-custom/bin/mlir-opt
compiler.mlir-opt.name=mlir-opt (our fork)
compiler.mlir-opt.semver=(fork)

compiler.mlir-translate.exe=/opt/compiler-explorer/mlir-custom/bin/mlir-translate
compiler.mlir-translate.name=mlir-translate (our fork)
compiler.mlir-translate.semver=(fork)
