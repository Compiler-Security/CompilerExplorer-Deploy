# MLIR：使用 LLVM 工具链自带的 mlir-opt / mlir-translate；路径走稳定软链 clang-latest。

compilers=&mliropt:&mlirtranslate
defaultCompiler=mlir-opt
compilerType=mlir
supportsBinary=false
supportsExecute=false
supportsAsmDocs=false

group.mliropt.compilers=mlir-opt
group.mliropt.baseName=MLIR opt
group.mliropt.isSemVer=true

# 组 ID 保持 mlirtranslate：CE 的 MLIR compilerType 据此为 translate 类工具启用输出过滤。
group.mlirtranslate.compilers=mlir-translate
group.mlirtranslate.baseName=MLIR translate
group.mlirtranslate.isSemVer=true

compiler.mlir-opt.exe=/opt/compiler-explorer/clang-latest/bin/mlir-opt
compiler.mlir-opt.semver=22.1.8

compiler.mlir-translate.exe=/opt/compiler-explorer/clang-latest/bin/mlir-translate
compiler.mlir-translate.semver=22.1.8
