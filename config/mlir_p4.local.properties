# MLIR P4：自研 p4mlir 工具与 p4mlir 版 mlir-translate，路径走稳定软链 p4-latest。

compilers=&p4mliropt:&p4mlirtojson:&mlirtranslate
defaultCompiler=p4mlir-opt
compilerType=mlir
supportsBinary=false
supportsExecute=false
supportsAsmDocs=false

group.p4mliropt.compilers=p4mlir-opt
group.p4mliropt.baseName=p4mlir-opt
group.p4mliropt.isSemVer=false
group.p4mlirtojson.compilers=p4mlir-to-json
group.p4mlirtojson.baseName=p4mlir-to-json
group.p4mlirtojson.isSemVer=false
# 组 ID 保持 mlirtranslate：CE 的 MLIR compilerType 据此识别 translate 类工具。
# 编译器 ID 使用 p4- 前缀，避免与标准 MLIR 的 mlir-translate 全局冲突。
group.mlirtranslate.compilers=p4-mlir-translate
group.mlirtranslate.baseName=mlir-translate
group.mlirtranslate.isSemVer=false

compiler.p4mlir-opt.exe=/opt/compiler-explorer/p4-latest/bin/p4mlir-opt
compiler.p4mlir-opt.name=p4mlir-opt
compiler.p4mlir-opt.semver=(fork)

compiler.p4mlir-to-json.exe=/opt/compiler-explorer/p4-latest/bin/p4mlir-to-json
compiler.p4mlir-to-json.name=p4mlir-to-json
compiler.p4mlir-to-json.semver=(fork)

compiler.p4-mlir-translate.exe=/opt/compiler-explorer/p4-latest/bin/mlir-translate
compiler.p4-mlir-translate.name=mlir-translate (P4 fork)
compiler.p4-mlir-translate.semver=(fork)
