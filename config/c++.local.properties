# C++：x86_64 原生与 riscv64 交叉工具链；路径均走稳定的 *-latest 相对软链。

compilers=&clang:&clangriscv:&gcc:&gccriscv
defaultCompiler=clanglatest
# 改为 true 可运行 x86_64 产物；riscv64 交叉产物仍需 qemu-user。
supportsExecute=false

# Clang x86_64
group.clang.compilers=clanglatest
group.clang.groupName=Clang x86-64
group.clang.baseName=x86-64 clang
group.clang.isSemVer=true
group.clang.compilerType=clang
group.clang.intelAsm=-mllvm --x86-asm-syntax=intel
group.clang.demangler=/opt/compiler-explorer/clang-latest/bin/llvm-cxxfilt
group.clang.options=--gcc-toolchain=/opt/compiler-explorer/gcc-latest

compiler.clanglatest.exe=/opt/compiler-explorer/clang-latest/bin/clang++
compiler.clanglatest.name=x86-64 clang (latest)
compiler.clanglatest.semver=latest

# Clang riscv64（复用同一 clang）
group.clangriscv.compilers=clangriscv
group.clangriscv.groupName=Clang riscv64
group.clangriscv.baseName=riscv64 clang
group.clangriscv.isSemVer=true
group.clangriscv.compilerType=clang
group.clangriscv.options=--target=riscv64-linux-gnu --gcc-toolchain=/opt/compiler-explorer/gcc-riscv-latest

compiler.clangriscv.exe=/opt/compiler-explorer/clang-latest/bin/clang++
compiler.clangriscv.name=riscv64 clang (latest, cross)
compiler.clangriscv.semver=latest
# 找不到 C 库头文件时，按实际 prepkg 布局补 --sysroot：
# compiler.clangriscv.options=--target=riscv64-linux-gnu --gcc-toolchain=/opt/compiler-explorer/gcc-riscv-latest --sysroot=/opt/compiler-explorer/gcc-riscv-latest/riscv64-linux-gnu/sysroot

# GCC x86_64（prepkg 二进制带三元组前缀）
group.gcc.compilers=gcclatest
group.gcc.groupName=GCC x86-64
group.gcc.baseName=x86-64 gcc
group.gcc.isSemVer=true
group.gcc.compilerType=gcc

compiler.gcclatest.exe=/opt/compiler-explorer/gcc-latest/bin/x86_64-linux-gnu-g++
compiler.gcclatest.name=x86-64 gcc (latest)
compiler.gcclatest.semver=latest

# GCC riscv64
group.gccriscv.compilers=gccriscv
group.gccriscv.groupName=GCC riscv64
group.gccriscv.baseName=riscv64 gcc
group.gccriscv.isSemVer=true
group.gccriscv.compilerType=gcc

compiler.gccriscv.exe=/opt/compiler-explorer/gcc-riscv-latest/bin/riscv64-linux-gnu-g++
compiler.gccriscv.name=riscv64 gcc (latest, cross)
compiler.gccriscv.semver=latest

# 运行库不能按相对前缀定位时再配置 ldPath：
# compiler.gcclatest.ldPath=/opt/compiler-explorer/gcc-latest/lib64
# compiler.clanglatest.ldPath=/opt/compiler-explorer/clang-latest/lib
