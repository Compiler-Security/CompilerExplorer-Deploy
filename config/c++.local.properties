# C++ 语言：登记官方最新 Clang 与 GCC。
# 组引用是字面 `&`。用稳定的 *-latest 符号链接路径 → 更新工具链不改本文件，只拨链接 + 重启。
# 容器内路径根 = /opt/compiler-explorer（宿主机 /srv/ce/compilers 只读挂载）。

compilers=&clang:&gcc
defaultCompiler=clanglatest
supportsExecute=false          # 策略 A：只编译看产物，不允许在线运行程序

# ---- Clang 组 ----
group.clang.compilers=clanglatest
group.clang.groupName=Clang x86-64
group.clang.baseName=x86-64 clang
group.clang.isSemVer=true
group.clang.compilerType=clang
group.clang.intelAsm=-mllvm --x86-asm-syntax=intel
group.clang.demangler=/opt/compiler-explorer/clang-latest/bin/llvm-cxxfilt
# clang 在非系统路径时，用 --gcc-toolchain 指向我们挂载的 GCC，提供 libstdc++ 与启动文件。
group.clang.options=--gcc-toolchain=/opt/compiler-explorer/gcc-latest

compiler.clanglatest.exe=/opt/compiler-explorer/clang-latest/bin/clang++
compiler.clanglatest.name=x86-64 clang (latest)
compiler.clanglatest.semver=latest

# ---- GCC 组 ----
group.gcc.compilers=gcclatest
group.gcc.groupName=GCC x86-64
group.gcc.baseName=x86-64 gcc
group.gcc.isSemVer=true
group.gcc.compilerType=gcc

compiler.gcclatest.exe=/opt/compiler-explorer/gcc-latest/bin/g++
compiler.gcclatest.name=x86-64 gcc (latest)
compiler.gcclatest.semver=latest

# 若预编译 GCC/Clang 的运行库不能被其相对前缀自动定位，再补（| 分隔，支持 ${exePath}）：
# compiler.gcclatest.ldPath=/opt/compiler-explorer/gcc-latest/lib64
# compiler.clanglatest.ldPath=/opt/compiler-explorer/clang-latest/lib
