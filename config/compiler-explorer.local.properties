# 全局资源限制：200s 超时、100s 排队、4 并发、64 MiB 汇编输出、16 MiB 上传。
compileTimeoutMs=200000
compilationStaleAfterMs=100000
maxConcurrentCompiles=4
max-asm-size=67108864
maxUploadSize=16mb

# 仅加载本部署需要的语言；CE 会额外保留项目构建清单语言。
restrictToLanguages=c,c++,llvm,mlir,p4

# 阻止插件、包装器、response file 和强制 include 等代码注入入口。
optionsForbiddenRe=^(-W[alp],)?((--?(wrapper|fplugin.*|specs|load|plugin|include|fmodule-mapper)|(@.*)|-I|-i)(=.*)?|--)$

# 关闭外部集成，短链接使用本地存储。
sentryDsn=
thirdPartyIntegrationEnabled=false
statusTrackingEnabled=false
storageSolution=local
