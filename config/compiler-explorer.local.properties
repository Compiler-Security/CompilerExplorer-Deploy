# 全局 CE 行为：资源与安全限制（对应 compiler-explorer.defaults.properties 的覆盖）。

compileTimeoutMs=200000        # 单次编译超时（默认 200s）
compilationStaleAfterMs=100000 # 排队多久后放弃
maxConcurrentCompiles=8        # 并发编译上限（32C 机器可调高，先保守）
max-asm-size=67108864          # 最大 asm 输出字节（64 MiB）
maxUploadSize=16mb             # 与 nginx client_max_body_size 对齐

# 危险编译选项黑名单（纵深防御；即便日后启用沙箱也建议保留）。
# 阻止用户注入插件/包装器等可执行任意代码的 flag。
optionsForbiddenRe=--plugin|-fplugin|--wrapper

# 关闭对外部服务的依赖（内网、无外呼）。
sentryDsn=
# 如有 Short URL 存储后端（默认用内存/外部存储），内网可保持默认；不需要外部链接分享。
