# 执行沙箱开关 —— nsjail（策略 B 底座）。
# 编译器沙箱与用户程序沙箱都走 nsjail；「在线运行」是否开放由语言的
# supportsExecute 控制（当前 c++.local.properties 里为 false，即只编译不运行）。
# 日后开放运行：把 c++.local.properties 的 supportsExecute 改 true 再 restart 即可，
# 本文件与宿主机 cgroup 都已就绪，无需再动。

sandboxType=nsjail        # 用户编译产物的执行沙箱（supportsExecute=true 时生效）
executionType=nsjail      # 编译器/工具本身的执行沙箱（现在就对每次编译生效）

# nsjail 二进制路径（镜像里装在 /usr/local/bin；默认 'nsjail' 走 PATH 也行，这里显式指定更稳）
nsjail=/usr/local/bin/nsjail

# 两个 nsjail 配置（CE 仓自带，路径相对 CE 根）。一般无需改；
# 若编译器装在 /opt/compiler-explorer 之外，需往对应 cfg 里加一个 bind mount（见 README）。
nsjail.config.execute=etc/nsjail/compilers-and-tools.cfg
nsjail.config.sandbox=etc/nsjail/user-execution.cfg
