# 执行沙箱开关。
# 策略 A（已定案）：只编译 / 看产物，不执行用户程序 → 两个都 none，容器层锁到最严。
#   （编译器子进程已受容器 read_only + cap_drop ALL + no-new-privileges + tmpfs 约束。）

sandboxType=none
executionType=none

# ---- 未来备选（策略 B，需要在线运行编译产物时才启用）----
# 用 CE 自家 fork 的 nsjail（github.com/compiler-explorer/nsjail, 分支 ce），并给容器放权：
#   sandboxType=nsjail
#   executionType=nsjail
#   nsjail=/usr/local/bin/nsjail
#   nsjail.config.execute=etc/nsjail/compilers-and-tools.cfg
#   nsjail.config.sandbox=etc/nsjail/user-execution.cfg
# 同时要在 compose 给 ce 服务加 --cap-add SYS_ADMIN、放开 seccomp/apparmor、可写 cgroup，
# 并先 cgcreate 建 ce-sandbox / ce-compile（重启失效，需 systemd oneshot 持久化）。
