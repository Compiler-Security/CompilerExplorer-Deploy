# 执行沙箱开关 —— nsjail（在 QEMU/KVM VM 内运行）。
# 隔离分两层：VM 是对宿主机的硬边界；nsjail 在 VM 内对每次编译/运行再沙箱。
# 「在线运行」是否开放由语言的 supportsExecute 控制（当前 c++.local.properties 里为 false，
# 即只编译不运行）。日后开放：改 supportsExecute=true 再 restart ce（本文件与 cgroup 已就绪）。

sandboxType=nsjail        # 用户编译产物的执行沙箱（supportsExecute=true 时生效）
executionType=nsjail      # 编译器/工具本身的执行沙箱（现在就对每次编译生效）

# nsjail 二进制路径（镜像里装在 /usr/local/bin；默认 'nsjail' 走 PATH 也行，这里显式指定更稳）
nsjail=/usr/local/bin/nsjail

# 两个 nsjail 配置（CE 仓自带，路径相对 CE 根；官方写法, cgroup 在 VM 根的 ce-compile/ce-sandbox）。
# 一般无需改；若编译器装在 /opt/compiler-explorer 之外，需往对应 cfg 里加一个 bind mount（见 README）。
nsjail.config.execute=etc/nsjail/compilers-and-tools.cfg
nsjail.config.sandbox=etc/nsjail/user-execution.cfg
