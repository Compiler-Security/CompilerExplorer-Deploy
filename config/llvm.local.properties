# LLVM IR：复用 clang-latest 中的 clang、llc 与 opt。

compilers=&irclang:&opt:&llc
defaultCompiler=clang-ir
supportsExecute=false

objdumper=/opt/compiler-explorer/clang-latest/bin/llvm-objdump
demangler=/opt/compiler-explorer/clang-latest/bin/llvm-cxxfilt

# Alive2 预配置：alive-tv 不存在时 CE 会隐藏该工具并记录一条 warning。
tools=alive2
tools.alive2.exe=/opt/compiler-explorer/alive2-latest/bin/alive-tv
tools.alive2.name=Alive2 (alive-tv)
tools.alive2.type=independent
tools.alive2.class=testing-tool
tools.alive2.stdinHint=disabled

# 用 clang 直接把 LLVM IR 编译为目标汇编。
group.irclang.compilers=clang-ir
group.irclang.groupName=Clang x86-64
group.irclang.baseName=clang
group.irclang.isSemVer=true
group.irclang.options=-x ir
group.irclang.intelAsm=-masm=intel

compiler.clang-ir.exe=/opt/compiler-explorer/clang-latest/bin/clang++
compiler.clang-ir.semver=22.1.8

# llc：LLVM IR 静态编译器。
group.llc.compilers=llc
group.llc.compilerType=llc
group.llc.supportsExecute=false
group.llc.groupName=LLVM Static Compiler
group.llc.baseName=llc
group.llc.isSemVer=true
group.llc.versionRe=LLVM version .*
group.llc.intelAsm=-masm=intel

compiler.llc.exe=/opt/compiler-explorer/clang-latest/bin/llc
compiler.llc.name=llc 22.1.8
compiler.llc.semver=22.1.8

# opt：LLVM IR 优化器。
group.opt.compilers=opt
group.opt.compilerType=opt
group.opt.supportsBinary=false
group.opt.supportsExecute=false
group.opt.instructionSet=llvm
group.opt.groupName=LLVM optimizer
group.opt.baseName=opt
group.opt.isSemVer=true
group.opt.versionRe=LLVM version .*

compiler.opt.exe=/opt/compiler-explorer/clang-latest/bin/opt
compiler.opt.name=opt 22.1.8
compiler.opt.semver=22.1.8
