# Lean 4：使用 lean-latest 稳定软链，leanc 由 CE 从同一工具链目录自动定位。

compilers=&lean
defaultCompiler=lean
compilerType=lean
# CE 的有效执行判定为 (interpreted || supportsBinary) && supportsExecute；
# leanc 产物本就是可执行 ELF，因此 supportsBinary=true 并配置 objdump 以支持二进制视图。
supportsBinary=true
# 下游补丁 0005 让 execution build 使用 leanc 链接 ELF；普通 ASM 视图仍使用 leanc -S。
supportsExecute=true
versionRe=^Lean \(version [^\n]+
objdumper=/opt/compiler-explorer/clang-latest/bin/llvm-objdump

group.lean.compilers=lean
group.lean.groupName=Lean 4
group.lean.baseName=Lean
group.lean.isSemVer=true

compiler.lean.exe=/opt/compiler-explorer/lean-latest/bin/lean
compiler.lean.name=Lean 4.33.0
compiler.lean.semver=4.33.0
