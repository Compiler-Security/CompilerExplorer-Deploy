name: ce

# Kata 备选路径；QEMU 主路径见 docker-compose.vm.yml。

services:
  ce:
    build:
      context: .
      args:
        CE_REF: "${CE_REF:-gh-18904}"
    image: ssct/compiler-explorer:local
    container_name: ce-app
    restart: unless-stopped
    runtime: kata

    user: "10001:10001"

    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=2g,uid=10001,gid=10001,mode=1777
      - /ce/lib/storage/data:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0700
      - /ce/out/compiler-cache:rw,noexec,nosuid,nodev,size=1g,uid=10001,gid=10001,mode=0700
    pids_limit: 2048

    volumes:
      # SELinux Enforcing 时给此挂载追加 z。
      - "${CE_COMPILERS_ROOT:?请在 .env 设置 CE_COMPILERS_ROOT（cp .env.example .env 后改实际路径）}:/opt/compiler-explorer:ro"
      - ./config/c++.local.properties:/ce/etc/config/c++.local.properties:ro
      - ./config/mlir.local.properties:/ce/etc/config/mlir.local.properties:ro
      - ./config/compiler-explorer.local.properties:/ce/etc/config/compiler-explorer.local.properties:ro
      # Kata 已提供 VM 边界，不启用容器内 nsjail。

    ports:
      - "${CE_BIND_ADDR:-127.0.0.1}:10240:10240"

    mem_limit: 6g
    cpus: 8
